<style>
:root{

}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0F1A1A; --card:#182626; --ink:#E8F1F0; --sub:#9DB0AE; --line:#2A3C3B; --red:#FF7A7F; }
}
:root[data-theme="dark"]{ --bg:#0F1A1A; --card:#182626; --ink:#E8F1F0; --sub:#9DB0AE; --line:#2A3C3B; --red:#FF7A7F; }
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0; min-height:100%; background:var(--bg); color:var(--ink);
  font-family:"Yu Gothic","YuGothic","游ゴシック","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif;
  -webkit-tap-highlight-color:transparent}
.wrap{max-width:560px; margin:0 auto; padding:16px 16px 32px}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible{outline:3px solid var(--orange); outline-offset:2px}
h1{font-size:1.35rem; margin:8px 0 4px; letter-spacing:.02em}
.lead{color:var(--sub); margin:0 0 18px; font-size:.95rem; line-height:1.6}

/* home */
.sheet{display:flex; align-items:center; gap:14px; width:100%; text-align:left; background:var(--card);
  border:1.5px solid var(--line); border-left:6px solid var(--teal); border-radius:12px; padding:14px 14px; margin-bottom:10px}
.sheet .no{font-weight:800; font-size:1.4rem; color:var(--teal); min-width:2.2em; text-align:center}
.sheet .tt{flex:1; font-weight:700; line-height:1.4}
.sheet .tt small{display:block; font-weight:400; color:var(--sub); font-size:.8rem; margin-top:2px}
.sheet .done{font-size:.8rem; color:var(--sub); white-space:nowrap}
.sheet.clear{border-left-color:var(--orange)}
.sheet.clear .done{color:var(--orange); font-weight:700}
.row{display:flex; gap:10px; margin:6px 0 16px}
.big{flex:1; border:none; border-radius:12px; padding:14px 10px; font-weight:800; font-size:1rem; background:var(--teal); color:#fff}
.big.alt{background:var(--card); color:var(--teal); border:2px solid var(--teal)}
.big:disabled{opacity:.4}
.resume{display:block; width:100%; margin:0 0 10px; background:var(--orange); text-align:left; padding:14px 16px; line-height:1.5}
.resume small{display:block; font-weight:600; opacity:.9; font-size:.85rem}

/* quiz */
.top{display:flex; align-items:center; gap:10px; margin-bottom:10px}
.back{border:none; background:none; color:var(--teal); font-weight:700; padding:8px 4px}
.bar{flex:1; height:10px; background:var(--line); border-radius:6px; overflow:hidden}
.bar i{display:block; height:100%; background:var(--teal); width:0; transition:width .3s}
.count{font-size:.85rem; color:var(--sub); min-width:4.5em; text-align:right}
.card{background:var(--card); border-radius:16px; border:1.5px solid var(--line); padding:20px 18px 18px; min-height:220px}
.tag{display:inline-block; font-size:.78rem; color:var(--teal-d); background:rgba(19,171,163,.12); border-radius:6px; padding:3px 8px; margin-bottom:12px}
:root[data-theme="dark"] .tag{color:#7fdcd6}
.q{font-size:1.25rem; line-height:1.85; margin:0 0 18px; font-weight:600}
.q .blank{display:inline-block; min-width:4.2em; border-bottom:3px solid var(--orange); margin:0 .15em; text-align:center; color:var(--orange); font-weight:800}
.ans{position:relative; border:2px dashed var(--line); border-radius:12px; padding:16px; min-height:70px;
  font-size:1.35rem; font-weight:800; color:var(--red); line-height:1.6; overflow:hidden}
.ans .lbl{display:block; font-size:.75rem; color:var(--sub); font-weight:600; margin-bottom:4px}
.sheetcover{position:absolute; inset:0; background:var(--redsheet); color:#fff; border:none; border-radius:10px;
  font-weight:800; font-size:1rem; display:flex; align-items:center; justify-content:center; transition:transform .35s ease}
.ans.open .sheetcover{transform:translateY(105%)}
#aText{visibility:hidden}
.ans.open #aText{visibility:visible}
.sheetcover{z-index:2}
@media (prefers-reduced-motion: reduce){ .sheetcover,.bar i{transition:none} }
.tools{display:flex; justify-content:flex-end; margin-top:10px}
.speak{border:1.5px solid var(--line); background:var(--card); border-radius:999px; padding:8px 14px; font-size:.9rem}
.judge{display:flex; gap:10px; margin-top:14px}
.judge button{flex:1; border:none; border-radius:14px; padding:16px 8px; font-size:1.15rem; font-weight:800; color:#fff}
.judge .o{background:var(--ok)} .judge .x{background:var(--ng)}
.judge button:disabled{opacity:.35}

/* result */
.result{text-align:center; padding:26px 16px}
.score{font-size:3rem; font-weight:900; color:var(--teal); margin:6px 0}
.score small{font-size:1.1rem; color:var(--sub)}
.msg{color:var(--sub); margin-bottom:20px; line-height:1.6}
.hidden{display:none !important}
</style>
</head>

</div>

// storage (per-viewer only)
let rec={};
try{ rec=JSON.parse(localStorage.getItem("rekishi_rec")||"{}")||{}; }catch(e){ rec={}; }
function save(){ try{ localStorage.setItem("rekishi_rec",JSON.stringify(rec)); }catch(e){} }

function saveSession(){ try{ localStorage.setItem("rekishi_session",JSON.stringify({ids:deck.map(q=>q.id),pos,wrong:wrong.map(q=>q.id),label})); }catch(e){} }
function clearSession(){ try{ localStorage.removeItem("rekishi_session"); }catch(e){} }
function loadSession(){ try{ const x=JSON.parse(localStorage.getItem("rekishi_session")||"null"); if(x&&Array.isArray(x.ids)&&x.pos<x.ids.length) return x; }catch(e){} return null; }
const $=id=>document.getElementById(id);
let deck=[],pos=0,wrong=[],label="";

function renderHome(){
  const list=$("list"); list.innerHTML="";
  Object.keys(SHEETS).forEach(k=>{
    const qs=Q.filter(q=>q.s==k), ok=qs.filter(q=>rec[q.id]==="o").length;
    const b=document.createElement("button");
    b.className="sheet"+(ok===qs.length?" clear":"");
    b.innerHTML=`<span class="no">${k}</span><span class="tt">${SHEETS[k]}<small>${qs.length}問</small></span><span class="done">${ok===qs.length?"クリア！":"○ "+ok+"/"+qs.length}</span>`;
    b.onclick=()=>start(qs,`プリント${k}`);
    list.appendChild(b);
  });
  const ses=loadSession(), rb=$("resumeBtn");
  if(ses){ rb.innerHTML=`▶ 続きから<small>${ses.label}　${ses.pos+1}問目から（のこり${ses.ids.length-ses.pos}問）</small>`; rb.classList.remove("hidden"); }
  else rb.classList.add("hidden");
  const ng=Q.filter(q=>rec[q.id]==="x");
  $("ngBtn").disabled=ng.length===0;
  $("ngBtn").textContent=ng.length?`×の問題だけ（${ng.length}）`:"×の問題だけ";
  show("home");
}
function show(id){ ["home","quiz","result"].forEach(s=>$(s).classList.toggle("hidden",s!==id)); window.scrollTo(0,0); }
function start(qs,lbl){ deck=qs.slice(); pos=0; wrong=[]; label=lbl; saveSession(); show("quiz"); renderQ(); }
function resume(){ const x=loadSession(); if(!x) return renderHome();
  const byId=id=>Q[id]; deck=x.ids.map(byId).filter(Boolean); pos=x.pos; wrong=(x.wrong||[]).map(byId).filter(Boolean); label=x.label;
  show("quiz"); renderQ(); }
function fmt(t){ return t.replace(B,'<span class="blank">？</span>'); }
function renderQ(){
  const q=deck[pos];
  $("tag").textContent=`${q.s}. ${SHEETS[q.s]}`;
  $("qText").innerHTML=fmt(q.q);
  $("aText").textContent=q.a;
  $("ans").classList.remove("open");
  $("cover").setAttribute("aria-hidden","false");
  $("okBtn").disabled=true; $("ngJudge").disabled=true;
  $("count").textContent=`${pos+1} / ${deck.length}`;
  $("barFill").style.width=(pos/deck.length*100)+"%";
  stopSpeak();
}
function reveal(){ $("ans").classList.add("open"); $("cover").setAttribute("aria-hidden","true"); $("okBtn").disabled=false; $("ngJudge").disabled=false; }
function judge(ok){
  const q=deck[pos]; rec[q.id]=ok?"o":"x"; save();
  if(!ok) wrong.push(q);
  pos++;
  if(pos<deck.length){ saveSession(); renderQ(); } else { clearSession(); finish(); }
}
function finish(){
  $("barFill").style.width="100%"; stopSpeak();
  const n=deck.length, ok=n-wrong.length;
  $("resTitle").textContent=label+" おわり！";
  $("score").innerHTML=`${ok}<small> / ${n}</small>`;
  $("resMsg").textContent= wrong.length===0 ? "全問○！クリアです。" : `×が${wrong.length}問あります。もう一回やって、ぜんぶ○にしよう。`;
  $("retryBtn").classList.toggle("hidden",wrong.length===0);
  show("result");
}
// read aloud
function stopSpeak(){ try{ speechSynthesis.cancel(); }catch(e){} }
function speak(){
  try{
    stopSpeak();
    const q=deck[pos];
    let t=q.q.replace(B,"なに");
    if($("ans").classList.contains("open")) t+="。こたえ、"+q.a;
    const u=new SpeechSynthesisUtterance(t); u.lang="ja-JP"; u.rate=0.9;
    speechSynthesis.speak(u);
  }catch(e){ $("speakBtn").textContent="読み上げが使えません"; }
}
$("cover").onclick=reveal;
$("okBtn").onclick=()=>judge(true);
$("ngJudge").onclick=()=>judge(false);
$("speakBtn").onclick=speak;
$("backBtn").onclick=renderHome;
$("homeBtn").onclick=renderHome;
$("retryBtn").onclick=()=>start(wrong,label+"（×だけ）");
$("resumeBtn").onclick=resume;
$("allBtn").onclick=()=>start(Q,"ぜんぶ");
$("ngBtn").onclick=()=>start(Q.filter(q=>rec[q.id]==="x"),"×の問題");
if(!("speechSynthesis" in window)) $("speakBtn").classList.add("hidden");
renderHome();
</script>
